[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths =
    core/tests
    coins/btc/tests
    coins/eth/tests
    coins/sol/tests
    coins/xrp/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning:ldap3.*
    ignore::DeprecationWarning:pyasn1.*
