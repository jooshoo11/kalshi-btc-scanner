# docker-compose.yml — Kalshi trading bot + tick recorder
# Run: docker compose up -d
# Stop: docker compose down

services:
  kalshi-bot:
    build: .
    container_name: kalshi-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - KALSHI_LIVE_TRADING=0
      - KALSHI_ENVIRONMENT=demo
    ports:
      - "8088:8088"
    volumes:
      - ./data:/app/data:rw
      - ./coins/btc/logs:/app/coins/btc/logs:rw
      - ./coins/eth/logs:/app/coins/eth/logs:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 1g
    cpus: "0.5"
    stop_signal: SIGINT
    stop_grace_period: 10s

  tick-recorder:
    build: .
    container_name: kalshi-tick-recorder
    restart: unless-stopped
    env_file:
      - .env
    command: ["python3", "scripts/tick_recorder.py", "--coins", "BTC,ETH"]
    volumes:
      - ./data:/app/data:rw
    mem_limit: 512m
    cpus: "0.25"
